
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Brain Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f4ff;
  color: #243052;
  text-align: center;
}

header {
  background: #243b70;
  color: white;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

main {
  max-width: 550px;
  margin: 25px auto;
  padding: 15px;
}

.stats {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  padding: 12px;
  border-radius: 12px;
  flex: 1;
  box-shadow: 0 2px 8px #0001;
}

.stat strong {
  display: block;
  font-size: 22px;
  color: #3459a5;
  margin-top: 5px;
}

.game-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.card {
  height: 105px;
  background: #4969b2;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 34px;
  cursor: pointer;
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.04);
}

.card.flipped,
.card.matched {
  background: white;
  color: #243052;
  border: 2px solid #4969b2;
}

.card.matched {
  background: #d9fbe5;
  border-color: #22a45a;
  cursor: default;
}

button.restart {
  background: #168653;
  color: white;
  border: none;
  padding: 13px 25px;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
  margin: 22px;
}

#message {
  font-weight: bold;
  min-height: 25px;
  color: #168653;
}

footer {
  padding: 20px;
  color: #65718d;
}

@media (max-width: 400px) {
  .card {
    height: 78px;
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🧠 Memory Match</h1>
  <p>Match the pairs. Challenge your brain!</p>
</header>

<main>

  <div class="stats">
    <div class="stat">
      Moves
      <strong id="moves">0</strong>
    </div>
    <div class="stat">
      Matches
      <strong id="matches">0 / 6</strong>
    </div>
    <div class="stat">
      Time
      <strong id="timer">0s</strong>
    </div>
  </div>

  <div class="game-board" id="board"></div>

  <p id="message">Find all 6 matching pairs!</p>

  <button class="restart" onclick="startGame()">
    🔄 Restart Game
  </button>

</main>

<footer>
  Memory Match © 2026 | Play and train your brain!
</footer>

<script>
const symbols = ["🍎", "🚀", "🐱", "⚽", "🌟", "🎵"];

let cards = [];
let firstCard = null;
let secondCard = null;
let locked = false;
let moves = 0;
let matches = 0;
let seconds = 0;
let timerInterval = null;
let started = false;

function startGame() {
  clearInterval(timerInterval);

  cards = [...symbols, ...symbols]
    .sort(() => Math.random() - 0.5);

  firstCard = null;
  secondCard = null;
  locked = false;
  moves = 0;
  matches = 0;
  seconds = 0;
  started = false;

  document.getElementById("moves").textContent = "0";
  document.getElementById("matches").textContent = "0 / 6";
  document.getElementById("timer").textContent = "0s";
  document.getElementById("message").textContent =
    "Find all 6 matching pairs!";

  const board = document.getElementById("board");
  board.innerHTML = "";

  cards.forEach((symbol, index) => {
    const card = document.createElement("button");
    card.className = "card";
    card.textContent = "?";
    card.setAttribute("aria-label", "Hidden card");
    card.onclick = () => flipCard(card, symbol);
    board.appendChild(card);
  });
}

function startTimer() {
  if (started) return;

  started = true;
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById("timer").textContent =
      seconds + "s";
  }, 1000);
}

function flipCard(card, symbol) {
  if (locked || card.classList.contains("flipped") ||
      card.classList.contains("matched")) return;

  startTimer();

  card.textContent = symbol;
  card.classList.add("flipped");

  if (!firstCard) {
    firstCard = { card, symbol };
    return;
  }

  secondCard = { card, symbol };
  moves++;

  document.getElementById("moves").textContent = moves;

  if (firstCard.symbol === secondCard.symbol) {
    firstCard.card.classList.add("matched");
    secondCard.card.classList.add("matched");

    matches++;
    document.getElementById("matches").textContent =
      matches + " / 6";

    resetTurn();

    if (matches === 6) {
      clearInterval(timerInterval);
      document.getElementById("message").textContent =
        "🎉 Congratulations! You won in " + moves +
        " moves and " + seconds + " seconds!";
    }
  } else {
    locked = true;

    setTimeout(() => {
      firstCard.card.textContent = "?";
      secondCard.card.textContent = "?";

      firstCard.card.classList.remove("flipped");
      secondCard.card.classList.remove("flipped");

      resetTurn();
    }, 800);
  }
}

function resetTurn() {
  firstCard = null;
  secondCard = null;
  locked = false;
}

startGame();
</script>

</body>
</html>
