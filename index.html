

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Brain Challenge</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f4ff;
  color: #243052;
  text-align: center;
}

header {
  background: #243b70;
  color: white;
  padding: 24px 12px;
}

header h1 { margin: 0; }

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 15px;
}

.stats {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.stat {
  flex: 1;
  background: white;
  padding: 12px 5px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
}

.stat strong {
  display: block;
  font-size: 21px;
  color: #3459a5;
  margin-top: 5px;
}

.game-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.card {
  min-width: 0;
  height: 85px;
  background: #4969b2;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 30px;
  cursor: pointer;
}

.card.flipped,
.card.matched {
  background: white;
  color: #243052;
  border: 2px solid #4969b2;
}

.card.matched {
  background: #d9fbe5;
  border-color: #22a45a;
  cursor: default;
}

button.action {
  background: #168653;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
  margin: 12px 5px;
}

#nextButton {
  background: #e59b20;
  display: none;
}

#message {
  font-weight: bold;
  color: #168653;
  min-height: 25px;
  line-height: 1.5;
}

footer {
  padding: 20px;
  color: #65718d;
}

@media (max-width: 400px) {
  .card { height: 68px; font-size: 24px; }
  .stat { font-size: 13px; }
  .stat strong { font-size: 18px; }
}
</style>
</head>

<body>

<header>
  <h1>🧠 Memory Match</h1>
  <p>Match the pairs. Challenge your brain!</p>
</header>

<main>

  <h2 id="levelTitle">Level 1</h2>
  <p id="levelDescription">Find all the matching pairs!</p>

  <div class="stats">
    <div class="stat">
      Moves
      <strong id="moves">0</strong>
    </div>
    <div class="stat">
      Matches
      <strong id="matches">0 / 6</strong>
    </div>
    <div class="stat">
      Time
      <strong id="timer">0s</strong>
    </div>
  </div>

  <div class="game-board" id="board"></div>

  <p id="message">Good luck! Find your first pair.</p>

  <button class="action" onclick="startLevel()">
    🔄 Restart Level
  </button>

  <button class="action" id="nextButton" onclick="nextLevel()">
    Next Level ➡️
  </button>

</main>

<footer>
  Memory Match © 2026 | Train Your Brain!
</footer>

<script>
const symbols = [
  "🍎","🚀","🐱","⚽","🌟","🎵","🍕","🐶",
  "🌈","🎁","🦋","🍓","🐼","🌻","🚗","🎈",
  "🐸","🍉","⭐","🎨"
];

let currentLevel = 1;
let cards = [];
let firstCard = null;
let secondCard = null;
let locked = false;
let moves = 0;
let matches = 0;
let seconds = 0;
let timerInterval = null;
let started = false;
let finished = false;

function getPairs() {
  return 5 + currentLevel;
}

function startLevel() {
  clearInterval(timerInterval);

  const pairCount = getPairs();

  moves = 0;
  matches = 0;
  seconds = 0;
  firstCard = null;
  secondCard = null;
  locked = false;
  started = false;
  finished = false;

  document.getElementById("levelTitle").textContent =
    "🏆 Level " + currentLevel;

  document.getElementById("levelDescription").textContent =
    "Find " + pairCount + " matching pairs!";

  document.getElementById("moves").textContent = "0";
  document.getElementById("matches").textContent =
    "0 / " + pairCount;
  document.getElementById("timer").textContent = "0s";

  document.getElementById("message").textContent =
    "Good luck! Find your first pair.";

  document.getElementById("nextButton").style.display = "none";

  const selected = symbols.slice(0, pairCount);
  cards = [...selected, ...selected];

  // Shuffle the cards
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }

  const board = document.getElementById("board");
  board.innerHTML = "";

  cards.forEach(symbol => {
    const card = document.createElement("button");
    card.className = "card";
    card.textContent = "?";
    card.setAttribute("aria-label", "Hidden card");
    card.onclick = () => flipCard(card, symbol);
    board.appendChild(card);
  });
}

function startTimer() {
  if (started) return;

  started = true;

  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById("timer").textContent =
      seconds + "s";
  }, 1000);
}

function flipCard(card, symbol) {
  if (locked || finished ||
      card.classList.contains("flipped") ||
      card.classList.contains("matched")) {
    return;
  }

  startTimer();

  card.textContent = symbol;
  card.classList.add("flipped");

  if (!firstCard) {
    firstCard = { card, symbol };
    return;
  }

  secondCard = { card, symbol };
  moves++;

  document.getElementById("moves").textContent = moves;

  if (firstCard.symbol === secondCard.symbol) {
    firstCard.card.classList.add("matched");
    secondCard.card.classList.add("matched");

    matches++;

    document.getElementById("matches").textContent =
      matches + " / " + getPairs();

    resetTurn();

    if (matches === getPairs()) {
      winLevel();
    }

  } else {
    locked = true;

    setTimeout(() => {
      firstCard.card.textContent = "?";
      secondCard.card.textContent = "?";

      firstCard.card.classList.remove("flipped");
      secondCard.card.classList.remove("flipped");

      resetTurn();
    }, 800);
  }
}

function resetTurn() {
  firstCard = null;
  secondCard = null;
  locked = false;
}

function winLevel() {
  finished = true;
  clearInterval(timerInterval);

  const message = document.getElementById("message");

  if (currentLevel === 10) {
    message.textContent =
      "🎉 Amazing! You completed all 10 levels! You are a Memory Master!";
  } else {
    message.textContent =
      "🎉 Level completed! You finished in " +
      moves + " moves and " + seconds + " seconds. Ready for the next challenge?";
  }

  if (currentLevel < 10) {
    document.getElementById("nextButton").style.display =
      "inline-block";
  }
}

function nextLevel() {
  if (currentLevel >= 10) return;

  currentLevel++;
  startLevel();
}

startLevel();
</script>

</body>
</html>
